<div class="cat-row">
    <input type="checkbox" name="category" value="{{ cat.slug }}"
           id="cat-{{ cat.id }}" class="cat-check"
           {% if cat.slug in selected_slugs %}checked{% endif %}>
    <label for="cat-{{ cat.id }}">{{ cat.title }}</label>

    {% if children %}
        <button type="button" class="cat-toggle collapsed"
                data-bs-toggle="collapse" data-bs-target="#sub-{{ cat.id }}"
                aria-expanded="false" aria-label="نمایش زیرمجموعه‌ها">
            <i class="fa fa-chevron-down"></i>
        </button>
    {% endif %}
</div>
